<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>GTA SA 原创模组站 - 第 2 页</title>
<style>
/* 这里复用主页大部分样式，只修改一些因为路径不同引起的细节 */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0c;--card:#141418;--line:#26262e;--line2:#33333d;--ink:#f4f4f6;--ink2:#a0a0ac;--dim:#5f5f6b;--accent:#ff3d68;--max:1240px;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 15% -5%,rgba(255,61,104,.12),transparent 60%),radial-gradient(800px 500px at 90% 5%,rgba(255,138,61,.08),transparent 60%),radial-gradient(700px 500px at 50% 100%,rgba(255,61,104,.06),transparent 60%);}
.navbar{position:sticky;top:0;z-index:1000;background:rgba(10,10,12,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);}
.nav-in{max-width:var(--max);height:72px;margin:auto;padding:0 28px;display:flex;align-items:center;gap:22px;}
.nav-logo{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:900;color:#fff;text-decoration:none;letter-spacing:-.5px;white-space:nowrap;}
.nav-logo .mark{width:8px;height:22px;background:var(--accent);flex-shrink:0;}
.nav-logo b{color:var(--accent);}
.nav-menu{flex:1;display:flex;justify-content:center;gap:32px;}
.nav-menu a{position:relative;color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;transition:color .25s;}
.nav-menu a:hover{color:#fff;}
.nav-menu a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--accent);transition:width .35s;}
.nav-menu a:hover::after{width:100%;}
.nav-search-box{position:relative;display:flex;align-items:center;width:260px;flex-shrink:0;}
.nav-search{flex:1;padding:10px 16px;background:var(--card);border:1px solid var(--line2);border-right:0;color:var(--ink);font-size:13px;outline:none;}
.nav-search-btn{padding:10px 18px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-size:12.5px;font-weight:750;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .3s;}
.nav-search-btn:hover{background:var(--accent);color:#0a0a0c;border-color:var(--accent);}
.nav-cta{padding:11px 22px;border:0;font-size:12.5px;font-weight:750;color:#0a0a0c;background:var(--accent);letter-spacing:.5px;text-transform:uppercase;transition:transform .25s;}
.nav-cta:hover{transform:translateY(-2px);}
.hero{max-width:var(--max);margin:auto;padding:60px 28px 40px;text-align:center;}
.hero h1{font-size:48px;font-weight:900;color:#fff;letter-spacing:-1.5px;margin-bottom:16px;}
.hero p{font-size:15px;color:var(--ink2);margin-bottom:24px;}
.band{max-width:var(--max);margin:auto;padding:0 28px;display:flex;align-items:center;gap:18px;}
.band .no{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:2px;}
.band .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent);}
.band .label{font-size:11.5px;color:var(--dim);letter-spacing:2.5px;text-transform:uppercase;font-weight:750;}
.feature{max-width:var(--max);margin:auto;padding:36px 28px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;}
.feature-card{position:relative;background:var(--card);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:border-color .3s,transform .5s,box-shadow .5s;}
.feature-card:hover{border-color:var(--line2);transform:translateY(-6px);box-shadow:0 26px 60px rgba(0,0,0,.55);}
.feature-img{position:relative;overflow:hidden;background:#0a0a0c;min-height:180px;aspect-ratio:16/9;}
.feature-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform 1s;}
.feature-card:hover .feature-img img{transform:scale(1.06);}
.feature-tag{position:absolute;top:12px;left:12px;padding:5px 12px;background:var(--accent);color:#0a0a0c;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;z-index:3;}
.feature-update{position:absolute;top:12px;right:12px;z-index:4;padding:5px 12px;background:var(--accent);color:#0a0a0c;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;animation:updPulse 1.8s ease-in-out infinite;}
@keyframes updPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,61,104,.5)}50%{box-shadow:0 0 0 10px rgba(255,61,104,0)}}
.feature-body{padding:24px;display:flex;flex-direction:column;gap:10px;}
.feature-no{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;}
.feature-title{font-size:22px;font-weight:900;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.feature-new{display:inline-block;padding:3px 9px;font-size:10px;font-weight:900;color:#0a0a0c;background:var(--accent);animation:updPulse 1.8s ease-in-out infinite;}
.feature-desc{font-size:13px;color:var(--ink2);}
.feature-meta{display:flex;gap:16px;font-size:12px;color:var(--dim);padding-top:12px;border-top:1px solid var(--line);margin-top:4px;flex-wrap:wrap;}
.feature-meta b{color:#fff;display:block;font-size:13px;margin-bottom:2px;}
.feature-meta span{font-size:10.5px;text-transform:uppercase;}
.feature-cta{margin-top:2px;font-size:12.5px;font-weight:800;color:var(--accent);text-transform:uppercase;}
.page-nav{max-width:var(--max);margin:40px auto 60px;padding:0 28px;display:flex;justify-content:space-between;}
.page-btn{display:inline-block;padding:12px 24px;background:var(--accent);color:#0a0a0c;font-size:13px;font-weight:800;text-transform:uppercase;text-decoration:none;transition:.3s;}
.page-btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(255,61,104,.4);}
.page-btn.outline{background:transparent;border:1px solid var(--line2);color:var(--ink2);}
.page-btn.outline:hover{border-color:var(--accent);color:var(--accent);}
/* 手机端适配 */
@media(max-width:960px){
  .nav-menu{display:none}
  .hero h1{font-size:36px}
  .feature{grid-template-columns:1fr 1fr;padding:24px 12px 0;gap:10px;}
  .feature-body{padding:10px;}
  .feature-title{font-size:12px;}
  .feature-desc{font-size:10px;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;display:-webkit-box;}
  .feature-meta{grid-template-columns:1fr 1fr;display:grid;gap:4px 8px;}
  .feature-meta b{font-size:11px;}
  .feature-meta span{font-size:8px;}
  .page-nav{flex-direction:column;gap:12px;}
  .page-btn{text-align:center;}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-in">
    <a class="nav-logo" href="../index.html">
      <span class="mark"></span>
      GTA SA <b>模组站</b>
    </a>
    <div class="nav-menu">
      <a href="../index.html">首页</a>
      <a href="javascript:void(0)">第二页</a>
    </div>
    <div class="nav-search-box" style="visibility:hidden;"></div>
    <a href="../index.html" class="nav-cta" style="text-decoration:none;display:inline-block;">返回首页</a>
  </div>
</nav>

<div class="hero">
  <h1>更多模组 · 第二页</h1>
  <p>部分精选与最新上架的模组合集</p>
</div>

<div class="band" style="padding-bottom:24px;">
  <span class="no">01</span>
  <span class="line"></span>
  <span class="label">New · 最新上架</span>
</div>

<div class="feature" style="padding-top:0;">
  <!-- CinematicIdleCamera_SA -->
  <div class="feature-card" onclick="window.location.href='../cinematic/'">
    <div class="feature-img">
      <img src="../1793277212963.png" alt="CinematicIdleCamera_SA" onerror="this.style.display='none'">
      <span class="feature-tag">AML插件</span>
      <span class="feature-update">已发布 v1.0</span>
    </div>
    <div class="feature-body">
      <span class="feature-no">No.01 · 电影运镜</span>
      <h3 class="feature-title">CinematicIdleCamera_SA <span class="feature-new">NEW</span></h3>
      <p class="feature-desc">CinematicIdleCamera 是GTA圣安地列斯安卓32位专用空闲电影运镜模组。</p>
      <div class="feature-meta">
        <div><b>v1.0</b><span>版本</span></div>
        <div><b>8.71M</b><span>大小</span></div>
        <div><b>2026.10.29</b><span>发布</span></div>
        <div><b>暂无</b><span>更新</span></div>
      </div>
      <span class="feature-cta">查看详情 →</span>
    </div>
  </div>
</div>

<div class="page-nav">
  <a href="../index.html" class="page-btn outline">← 上一页</a>
  <a href="../index.html" class="page-btn">返回首页</a>
</div>

</body>
</html>
